<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>順心車行｜V3.0 本機測試版</title>
<style>
:root{--blue:#174c78;--bg:#f3f6f9;--line:#dce4eb;--ink:#1e2935}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{background:var(--blue);color:white;padding:18px 20px}header h1{margin:0;font-size:21px}header small{opacity:.85}.wrap{max-width:1100px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #17324d0a}.hidden{display:none!important}label{display:block;font-size:14px;margin:10px 0 5px}input,select,button{font:inherit;padding:10px;border:1px solid #cbd5df;border-radius:8px;width:100%;background:white}button{background:var(--blue);color:white;border:0;cursor:pointer;font-weight:600;margin-top:10px}button.secondary{background:#e8eef4;color:#183b58}button.danger{background:#a52d36}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{width:auto;margin:0}.tabs button.active{background:#0e2e49}.muted{color:#64748b;font-size:13px}.stat{font-size:25px;font-weight:750}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px}th{background:#f6f8fa}.actions{display:flex;gap:6px}.actions button{margin:0;padding:7px 9px;width:auto;font-size:13px}.notice{padding:10px 12px;border-radius:8px;background:#fff7df;color:#765516;font-size:13px}.login{max-width:420px;margin:35px auto}.pill{display:inline-block;background:#e8eef4;border-radius:20px;padding:4px 9px;font-size:12px}.right{float:right}.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
</style></head><body>
<header><h1>順心車行</h1><small>V3.0 本機測試版｜客人車資記帳與月結</small><span id="who" class="right"></span></header>
<div class="wrap">
<section id="login" class="card login"><h2>系統登入</h2><div class="notice">首次使用請先設定最高管理者密碼。此測試版資料只存在目前瀏覽器。</div><label>帳號</label><input id="loginUser" autocomplete="username" placeholder="帳號"><label>密碼</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="密碼"><button onclick="login()">登入</button><p id="loginMsg" class="muted"></p><div id="firstSetup" class="hidden"><hr><p>首次啟用：最高管理者帳號固定為 <b>BNHUANG0429</b>，請設定密碼。</p><label>設定管理者密碼</label><input id="setupPass" type="password"><button onclick="setupAdmin()">建立管理者帳號</button></div></section>
<section id="app" class="hidden">
<div class="tabs" id="tabs"></div>
<div id="panel"></div>
<button class="secondary" onclick="logout()">登出</button>
</section></div>
<script>
const KEY='shunxin_v3_local_data';let db,me,editId=null;
const seed=()=>({users:[{id:'admin',name:'最高管理者',username:'BNHUANG0429',password:'',role:'admin',active:true}],routes:[],customers:[],trips:[]});
function load(){try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){db=seed()}if(!db.users?.length)db=seed();save();if(!db.users.find(x=>x.role==='admin')?.password)document.getElementById('firstSetup').classList.remove('hidden')}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function setupAdmin(){let p=document.getElementById('setupPass').value;if(p.length<6)return alert('密碼至少 6 碼');let a=db.users.find(x=>x.role==='admin');a.password=p;save();alert('管理者帳號已建立，請登入。');document.getElementById('firstSetup').classList.add('hidden');document.getElementById('loginUser').value='BNHUANG0429'}
function login(){let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPass').value;let x=db.users.find(v=>v.username===u&&v.password===p&&v.active);if(!x){document.getElementById('loginMsg').textContent='帳號或密碼錯誤，或帳號已停用。';return}me=x;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('who').textContent=x.name+'｜'+roleName(x.role);render()}
function logout(){me=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('who').textContent=''}function roleName(r){return {admin:'最高管理者',viewer:'數據檢視者',driver:'司機'}[r]}
function tabs(){let arr=me.role==='driver'?[['record','新增記帳'],['mine','我的本月紀錄']]:me.role==='viewer'?[['report','報表查詢']]:[['report','月結與報表'],['users','司機與帳號'],['routes','路線與固定價格'],['customers','客戶名稱'],['cloud','雲端資料設定']];document.getElementById('tabs').innerHTML=arr.map((x,i)=>`<button class="${i===0?'active':''}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join('');show(arr[0][0],document.querySelector('#tabs button'))}
function show(k,b){document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');({record:recordPanel,mine:minePanel,report:reportPanel,users:usersPanel,routes:routesPanel,customers:customersPanel,cloud:cloudPanel}[k])()}
function panel(s){document.getElementById('panel').innerHTML=s}
function today(){return new Date().toISOString().slice(0,10)}function month(){return today().slice(0,7)}function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}
function routeOptions(){return '<option value="">選擇路線</option>'+db.routes.map(r=>`<option value="${r.id}">${esc(r.name)}（${money(r.price)}）</option>`).join('')}
function customerOptions(){return '<option value="">選擇請款對象</option>'+db.customers.map(c=>`<option>${esc(c.name)}</option>`).join('')}
function recordPanel(){let t=db.trips.find(x=>x.id===editId);panel(`<div class="card"><h2>${t?'修改':'新增'}乘車記帳</h2><div class="row"><div><label>日期</label><input id="dDate" type="date" value="${t?.date||today()}"></div><div><label>路線</label><select id="dRoute" onchange="fillFare()">${routeOptions()}</select></div><div><label>車資金額</label><input id="dFare" type="number" min="0" value="${t?.fare??''}" placeholder="輸入金額"></div><div><label>請款對象</label><select id="dCustomer">${customerOptions()}</select></div></div><label>備註（選填）</label><input id="dNote" value="${esc(t?.note||'')}" placeholder="例如：代駕、乘客備註"><button onclick="saveTrip()">${t?'儲存修改':'新增紀錄'}</button>${t?'<button class="secondary" onclick="editId=null;recordPanel()">取消修改</button>':''}<p class="muted">路線與價格由管理者維護；若沒有合適路線，可先由管理者新增。</p></div>`);if(t){document.getElementById('dRoute').value=t.routeId||'';document.getElementById('dCustomer').value=t.customer||''}}
function fillFare(){let r=db.routes.find(x=>x.id===document.getElementById('dRoute').value);if(r)document.getElementById('dFare').value=r.price}
function saveTrip(){let date=document.getElementById('dDate').value,routeId=document.getElementById('dRoute').value,fare=Number(document.getElementById('dFare').value),customer=document.getElementById('dCustomer').value;if(!date||!routeId||!Number.isFinite(fare)||fare<0)return alert('請填妥日期、路線及正確金額');let r=db.routes.find(x=>x.id===routeId),obj={id:editId||String(Date.now()),date,routeId,route:r?.name||'',fare,customer,note:document.getElementById('dNote').value,driverId:me.id,driver:me.name};if(editId){let i=db.trips.findIndex(x=>x.id===editId);if(i>=0&&me.role==='driver'&&db.trips[i].driverId!==me.id)return alert('不能修改其他司機紀錄');if(i>=0)db.trips[i]=obj}else db.trips.push(obj);save();editId=null;alert('紀錄已儲存');me.role==='driver'?minePanel():reportPanel()}
function minePanel(){let list=db.trips.filter(t=>t.driverId===me.id&&t.date.startsWith(month())).sort((a,b)=>b.date.localeCompare(a.date));let sum=list.reduce((s,t)=>s+t.fare,0);panel(`<div class="grid2"><div class="card"><div class="muted">本月趟次</div><div class="stat">${list.length}</div></div><div class="card"><div class="muted">本月車資總額</div><div class="stat">${money(sum)}</div></div></div><div class="card"><h2>我的 ${month()} 紀錄</h2>${tripTable(list,true)}</div>`)}
function tripTable(list,own=false){return `<div class="table-wrap"><table><thead><tr><th>日期</th><th>司機</th><th>路線</th><th>請款對象</th><th>金額</th><th>備註</th>${own?'<th>操作</th>':''}</tr></thead><tbody>${list.map(t=>`<tr><td>${t.date}</td><td>${esc(t.driver)}</td><td>${esc(t.route)}</td><td>${esc(t.customer||'—')}</td><td>${money(t.fare)}</td><td>${esc(t.note||'')}</td>${own?`<td><div class="actions"><button class="secondary" onclick="editTrip('${t.id}')">修改</button><button class="danger" onclick="deleteTrip('${t.id}')">刪除</button></div></td>`:''}</tr>`).join('')||'<tr><td colspan="7">目前沒有紀錄</td></tr>'}</tbody></table></div>`}
function editTrip(id){editId=id;recordPanel()}function deleteTrip(id){if(!confirm('確定刪除這筆紀錄？'))return;let t=db.trips.find(x=>x.id===id);if(!t||me.role==='driver'&&t.driverId!==me.id)return alert('無權限');db.trips=db.trips.filter(x=>x.id!==id);save();minePanel()}
function reportPanel(){let m=month();panel(`<div class="card"><h2>月結與報表</h2><div class="row"><div><label>月份</label><input id="rMonth" type="month" value="${m}" onchange="refreshReport()"></div><div><label>司機篩選</label><select id="rDriver" onchange="refreshReport()"><option value="">全部司機</option>${db.users.filter(u=>u.role==='driver').map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div><div><label>開始日期（區間查詢）</label><input id="rStart" type="date" onchange="refreshReport()"></div><div><label>結束日期（區間查詢）</label><input id="rEnd" type="date" onchange="refreshReport()"></div></div><div id="reportResult"></div><button onclick="exportExcel()">匯出 Excel（CSV）</button><p class="muted">Excel 可開啟 CSV。月結總表依司機統計趟次及客人車資總額，另附逐筆明細。</p></div>`);refreshReport()}
function filtered(){let m=document.getElementById('rMonth').value,drv=document.getElementById('rDriver').value,s=document.getElementById('rStart').value,e=document.getElementById('rEnd').value;return db.trips.filter(t=>(!s||t.date>=s)&&(!e||t.date<=e)&&(s||e||t.date.startsWith(m))&&(!drv||t.driverId===drv)).sort((a,b)=>a.date.localeCompare(b.date))}
function refreshReport(){let list=filtered(),map={};list.forEach(t=>{let x=map[t.driverId]||(map[t.driverId]={name:t.driver,count:0,total:0});x.count++;x.total+=Number(t.fare)});let sums=Object.values(map);document.getElementById('reportResult').innerHTML=`<div class="grid2"><div class="card"><div class="muted">查詢趟次</div><div class="stat">${list.length}</div></div><div class="card"><div class="muted">車資總額</div><div class="stat">${money(list.reduce((s,t)=>s+Number(t.fare),0))}</div></div></div><h3>司機月結總表</h3><div class="table-wrap"><table><thead><tr><th>司機</th><th>當期趟次</th><th>車資總額</th></tr></thead><tbody>${sums.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.count}</td><td>${money(x.total)}</td></tr>`).join('')||'<tr><td colspan="3">沒有資料</td></tr>'}</tbody></table></div><h3>逐筆行程明細</h3>${tripTable(list,false)}`}
function exportExcel(){let list=filtered(),m=document.getElementById('rMonth').value||'區間';let rows=[['順心車行月結總表'],['司機','當期趟次','車資總額']];let map={};list.forEach(t=>{let x=map[t.driver]||(map[t.driver]={n:0,s:0});x.n++;x.s+=Number(t.fare)});Object.entries(map).forEach(([n,x])=>rows.push([n,x.n,x.s]));rows.push([],['逐筆明細'],['日期','司機','路線','請款對象','金額','備註']);list.forEach(t=>rows.push([t.date,t.driver,t.route,t.customer,t.fare,t.note]));let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`順心車行_${m}_月結報表.csv`;a.click();URL.revokeObjectURL(a.href)}
function usersPanel(){panel(`<div class="card"><h2>新增帳號</h2><div class="row"><div><label>姓名／顯示名稱</label><input id="uName"></div><div><label>登入帳號</label><input id="uUser"></div><div><label>初始密碼（至少 6 碼）</label><input id="uPass" type="password"></div><div><label>角色</label><select id="uRole"><option value="driver">司機</option><option value="viewer">數據檢視者</option><option value="admin">管理者</option></select></div></div><button onclick="addUser()">新增帳號</button></div><div class="card"><h2>帳號管理</h2><div class="table-wrap"><table><tr><th>姓名</th><th>帳號</th><th>角色</th><th>狀態</th><th>操作</th></tr>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${roleName(u.role)}</td><td>${u.active?'啟用':'停用'}</td><td>${u.id==='admin'?'—':`<button class="secondary" onclick="toggleUser('${u.id}')">${u.active?'停用':'啟用'}</button> <button class="danger" onclick="resetPass('${u.id}')">重設密碼</button>`}</td></tr>`).join('')}</table></div></div>`)}
function addUser(){let name=uName.value.trim(),username=uUser.value.trim(),password=uPass.value,role=uRole.value;if(!name||!username||password.length<6)return alert('請填姓名、帳號及至少 6 碼密碼');if(db.users.some(u=>u.username===username))return alert('帳號已存在');db.users.push({id:'u'+Date.now(),name,username,password,role,active:true});save();usersPanel()}
function toggleUser(id){let u=db.users.find(x=>x.id===id);u.active=!u.active;save();usersPanel()}function resetPass(id){let p=prompt('輸入新密碼（至少 6 碼）');if(p===null)return;if(p.length<6)return alert('密碼至少 6 碼');db.users.find(x=>x.id===id).password=p;save();alert('密碼已重設')}
function routesPanel(){panel(`<div class="card"><h2>新增路線與固定價格</h2><div class="row"><div><label>路線名稱（起點－終點）</label><input id="routeName" placeholder="例如：日照中心－田寮"></div><div><label>固定價格</label><input id="routePrice" type="number" min="0"></div></div><button onclick="addRoute()">新增路線</button></div><div class="card"><h2>路線清單</h2><table><tr><th>路線</th><th>固定價格</th><th>操作</th></tr>${db.routes.map(r=>`<tr><td>${esc(r.name)}</td><td>${money(r.price)}</td><td><button class="danger" onclick="delRoute('${r.id}')">刪除</button></td></tr>`).join('')||'<tr><td colspan="3">尚未設定路線</td></tr>'}</table></div>`)}function addRoute(){let n=routeName.value.trim(),p=Number(routePrice.value);if(!n||routePrice.value===''||p<0)return alert('請填路線及價格');db.routes.push({id:'r'+Date.now(),name:n,price:p});save();routesPanel()}function delRoute(id){if(confirm('刪除此路線？')){db.routes=db.routes.filter(r=>r.id!==id);save();routesPanel()}}
function customersPanel(){panel(`<div class="card"><h2>客戶／請款對象管理</h2><label>新增名稱</label><input id="custName" placeholder="輸入客戶或請款對象名稱"><button onclick="addCustomer()">新增名稱</button></div><div class="card"><h2>名稱清單</h2>${db.customers.map(c=>`<p>${esc(c.name)} <button class="danger" style="width:auto" onclick="delCustomer('${c.id}')">刪除</button></p>`).join('')||'尚未設定客戶名稱。司機端下拉選單目前保持空白。'}</div>`)}function addCustomer(){let n=custName.value.trim();if(!n)return alert('請輸入名稱');if(db.customers.some(c=>c.name===n))return alert('名稱已存在');db.customers.push({id:'c'+Date.now(),name:n});save();customersPanel()}function delCustomer(id){if(confirm('刪除此名稱？')){db.customers=db.customers.filter(c=>c.id!==id);save();customersPanel()}}
function cloudPanel(){panel(`<div class="card"><h2>雲端資料設定</h2><div class="notice">目前版本為本機測試，尚未連接雲端。資料只保存在這個瀏覽器，清除瀏覽器資料或更換裝置可能遺失。</div><p>未來預計支援 Supabase 專案連線、同步狀態、備份與還原。正式連線需要安全的伺服器端設定，不能將雲端管理金鑰直接放在前端。</p><p class="muted">此區目前僅作功能預留，尚未啟用連線或同步。</p><button class="secondary" onclick="backup()">下載本機資料備份 JSON</button><label>還原本機備份 JSON</label><input id="restoreFile" type="file" accept="application/json"><button class="secondary" onclick="restore()">匯入備份</button></div>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='順心車行_本機備份.json';a.click();URL.revokeObjectURL(a.href)}function restore(){let f=restoreFile.files[0];if(!f)return alert('請先選擇備份檔');let rd=new FileReader();rd.onload=()=>{try{let x=JSON.parse(rd.result);if(!x.users||!x.trips||!x.routes||!x.customers)throw Error();if(!confirm('匯入會覆蓋目前本機資料，確定繼續？'))return;db=x;save();alert('備份還原完成');render()}catch(e){alert('檔案格式不正確')}};rd.readAsText(f)}
function render(){tabs()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
load();
</script></body></html>
